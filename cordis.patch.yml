# dsh-latex-tools bundle patch: inserts its plugin row into the web plugin
# roster. The single row mounts BOTH halves: the host side (serves the
# MathJax es5 script used by SVG export under /dsh-latex-tools/mathjax) and the
# browser side (the modules node half scans dsh.client packages into the web
# plugin roster, served from this package's lib/client.js).
- insert:
    - id: dsh-latex-tools
      name: dsh-latex-tools
